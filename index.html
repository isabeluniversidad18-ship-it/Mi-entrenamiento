<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis entrenamientos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{--bg:#0c1014;--pn:#141b22;--ln:#232d37;--tx:#e6edf3;--mu:#8795a3;--ac:#59c3ff;--am:#f2b134;--ok:#5fd39a;--bad:#ff6b6b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Barlow,system-ui,sans-serif}
h1,h2,h3{font-family:"Barlow Condensed",system-ui,sans-serif;margin:0 0 8px;letter-spacing:.2px}h1{font-size:26px}h2{font-size:21px}h3{font-size:17px;color:var(--mu)}
nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);display:flex;gap:4px;overflow-x:auto;padding:8px 10px;border-bottom:1px solid var(--ln);z-index:5}
nav button{flex:none;background:none;border:0;color:var(--mu);font:600 15px Barlow,sans-serif;padding:8px 12px;border-radius:8px;cursor:pointer}
nav button.on{color:var(--bg);background:var(--ac)}
main{max-width:980px;margin:0 auto;padding:14px 12px 60px}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.c{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px}.g>.c{margin:0}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.k div{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:10px 12px}.k b{display:block;font:700 28px "Barlow Condensed",sans-serif}.k span{color:var(--mu);font-size:13px}
input,select,textarea{background:#0c1218;color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px;font:inherit;width:100%}
textarea{min-height:60px}label{display:block;font-size:13px;color:var(--mu)}
.f{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));align-items:end;margin-bottom:8px}
button.b{background:var(--ac);color:var(--bg);border:0;border-radius:8px;padding:9px 14px;font:600 14px Barlow,sans-serif;cursor:pointer}
button.s{background:none;color:var(--mu);border:1px solid var(--ln);border-radius:8px;padding:5px 9px;cursor:pointer;font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.ch{width:100%;height:auto;fill:var(--mu);font-size:9px}.mu{color:var(--mu)}
.r{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--ln)}.r:first-of-type{border-top:0}
.t{font-size:12px;border-radius:6px;padding:2px 7px;font-weight:600}.p{background:#3a2d12;color:var(--am)}.d{background:#12372a;color:var(--ok)}
.w{color:var(--am)}.bad{color:var(--bad)}.ok{color:var(--ok)}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:5px 4px;border-top:1px solid var(--ln);font-size:14px}th{color:var(--mu);font-weight:500}
.bar{height:8px;background:var(--ac);border-radius:4px}pre{white-space:pre-wrap;font:inherit;margin:0}
</style></head><body>
<nav id="nav"></nav><main id="app"><p class="mu">Cargando tus datos…</p></main>
<script>
const TY=["CrossFit","Gimnasio","Natación","Otro"],SW=["Crol","Espalda","Braza","Mariposa","Estilos"],DN=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const TABS=[["ini","Inicio"],["gym","Gimnasio"],["cf","CrossFit"],["nat","Natación"],["car","Carga y recuperación"],["ia","Entrenador IA"],["dat","Datos"]];
const MO={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12,ene:1,abr:4,ago:8,dic:12};
const GR=[["Piernas",["squat","sentadilla","leg","lunge","zancada","calf","gemelo","hip thrust","peso muerto","deadlift","glute"]],["Core",["crunch","plank","plancha","abdom","core","sit up"]],["Brazos",["curl","tricep","bicep","dip","fondos","skull"]],["Hombros",["shoulder","overhead","militar","hombro","lateral raise","face pull","arnold"]],["Espalda",["row","remo","pull","lat ","jalón","dominada","chin","back"]],["Pecho",["bench","chest","pecho","fly","apertura","push up","flexion","pec"]]];
const S0=()=>({plan:{1:"CrossFit",2:"Gimnasio",3:"Descanso",4:"Natación",5:"CrossFit",6:"Descanso",0:"Descanso"},ses:[],well:[],hevy:{w:[],x:[]}});
let S=S0(),tab="ini",gx="",gg="Todos",draft=[],AI=null,exp="",st="",SM=null,refs=null,timer=null;
const $=q=>document.querySelector(q),v=id=>document.getElementById(id)?.value??"",esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=x=>{const n=parseFloat(String(x).replace(",","."));return isNaN(n)?null:n},avg=a=>a.length?a.reduce((p,q)=>p+q,0)/a.length:0,sum=a=>a.reduce((p,q)=>p+q,0),r1=x=>Math.round(x*10)/10;
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),today=()=>iso(new Date());
const addD=(s,n)=>{const d=new Date(s+"T12:00");d.setDate(d.getDate()+n);return iso(d)},mon=s=>{const d=new Date(s+"T12:00");d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)},fm=s=>s.slice(8)+"/"+s.slice(5,7);
const done=()=>S.ses.filter(s=>s.done).concat(S.hevy.w.map(w=>({...w,type:"Gimnasio",done:true,src:"hevy"})));
const ld=s=>s.dur&&s.rpe?s.dur*s.rpe:0,weeks=n=>{const m=mon(today());return Array.from({length:n},(_,i)=>addD(m,-7*(n-1-i)))};
const grp=e=>{e=" "+e.toLowerCase()+" ";for(const[g,k]of GR)if(k.some(w=>e.includes(w)))return g;return"Otros"};
const pt=t=>{t=String(t);if(t.includes(":")){const[m,s]=t.split(":");return(+m)*60+(+s||0)}return num(t)};
const mmss=s=>Math.floor(s/60)+":"+String(Math.round(s%60)).padStart(2,"0");
function bars(a,l,c){const m=Math.max(...a,1);return`<svg viewBox="0 0 300 120" class="ch">`+a.map((y,i)=>{const h=y/m*80;return`<rect x="${i*37.5+5}" y="${95-h}" width="27" height="${h}" rx="3" fill="${c}"/><text x="${i*37.5+18.5}" y="110" text-anchor="middle">${l[i]}</text>${y?`<text x="${i*37.5+18.5}" y="${91-h}" text-anchor="middle">${Math.round(y)}</text>`:""}`}).join("")+`</svg>`}
function line(a,l,c){a=a.slice(-30);l=l.slice(-30);if(a.length<2)return'<p class="mu">Hacen falta al menos 2 registros para ver evolución.</p>';const mn=Math.min(...a),mx=Math.max(...a),rg=mx-mn||1,n=a.length,P=a.map((y,i)=>[10+i*280/(n-1),90-(y-mn)/rg*70]);return`<svg viewBox="0 0 300 120" class="ch"><polyline fill="none" stroke="${c}" stroke-width="2" points="${P.map(p=>p.join(",")).join(" ")}"/>${P.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.5" fill="${c}"/>`).join("")}<text x="2" y="12">${r1(mx)}</text><text x="2" y="104">${r1(mn)}</text><text x="10" y="117">${l[0]}</text><text x="290" y="117" text-anchor="end">${l[n-1]}</text></svg>`}
/* Guardado */
function save(){st="Guardando…";paint();clearTimeout(timer);timer=setTimeout(async()=>{try{if(refs){await refs.a.set({plan:S.plan,ses:S.ses,well:S.well});await refs.h.set(S.hevy);st="Guardado en la nube ✓"}else{localStorage.setItem("ent",JSON.stringify(S));st="Guardado solo en este navegador"}}catch(e){try{localStorage.setItem("ent",JSON.stringify(S))}catch(_){}st="No se pudo guardar en la nube ("+(e.code||"error")+"). Exporta una copia en Datos."}paint()},600)}
function paint(){const e=$("#st");if(e)e.textContent=st}
async function init(){render();try{const[db,us,sm]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("sample")]);SM=sm;const id=us&&await us.id();if(db&&id){const c=db.collection("data/users/"+id);refs={a:c.doc("app"),h:c.doc("hevy")};const g=await Promise.race([Promise.all([refs.a.get(),refs.h.get()]),new Promise((_,j)=>setTimeout(()=>j(0),10000))]);const a=g[0].data(),h=g[1].data();if(a)S={...S0(),...a};if(h&&h.w)S.hevy=h;st="Guardado en la nube ✓"}}catch(e){refs=null}
if(!refs){try{const l=localStorage.getItem("ent");if(l)S={...S0(),...JSON.parse(l)};st="Sin conexión a la nube: guardo solo en este navegador"}catch(_){st="Sin guardado automático: usa Exportar en Datos"}}
S.hevy=S.hevy||{w:[],x:[]};render()}
/* Hevy */
function csv(t){const r=[];let w=[],c="",q=false;for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=h}else if(h=='"')q=true;else if(h==","){w.push(c);c=""}else if(h=="\n"||h=="\r"){if(h=="\r"&&t[i+1]=="\n")i++;w.push(c);c="";if(w.length>1)r.push(w);w=[]}else c+=h}if(c||w.length){w.push(c);if(w.length>1)r.push(w)}return r}
function pd(s){s=String(s||"");let m=s.match(/^\d{4}-\d\d-\d\d/);if(m)return new Date(s.replace(" ","T"));m=s.match(/(\d{1,2})\s+([A-Za-z]{3})\w*\.?\s+(\d{4}),?\s*(\d{1,2}):(\d\d)/);return m&&MO[m[2].toLowerCase()]?new Date(+m[3],MO[m[2].toLowerCase()]-1,+m[1],+m[4],+m[5]):new Date(NaN)}
function impHevy(t){const r=csv(t),h=(r.shift()||[]).map(x=>x.trim()),ix=k=>h.indexOf(k),need=["title","start_time","exercise_title","weight_kg","reps"],miss=need.filter(k=>ix(k)<0);if(miss.length)return"Este CSV no parece de Hevy: faltan las columnas "+miss.join(", ")+".";
const W={},X={};let bad=0,sets=0;for(const w of r){const g=k=>ix(k)<0?"":w[ix(k)],s=pd(g("start_time"));if(isNaN(s)){bad++;continue}const d=iso(s),ti=g("title"),id=d+"|"+ti,e=pd(g("end_time"));W[id]=W[id]||{id,date:d,title:ti,dur:isNaN(e)?null:Math.round((e-s)/6e4),rp:[]};const rp=num(g("rpe"));if(rp)W[id].rp.push(rp);if(g("set_type")=="warmup")continue;const kg=num(g("weight_kg"))||0,rep=num(g("reps"))||0;if(!rep)continue;sets++;const ex=g("exercise_title"),k=d+"|"+ex;X[k]=X[k]||{d,e:ex,k:0,r:0,v:0,n:0,m:0};const o=X[k];o.k=Math.max(o.k,kg);o.r+=rep;o.v+=kg*rep;o.n++;o.m=Math.max(o.m,kg*(1+rep/30))}
const nw=Object.values(W).map(w=>({id:w.id,date:w.date,title:w.title,dur:w.dur,rpe:w.rp.length?r1(avg(w.rp)):null}));S.hevy.w=S.hevy.w.filter(a=>!W[a.id]).concat(nw);const xs=Object.values(X).map(o=>({...o,v:Math.round(o.v),m:r1(o.m)}));S.hevy.x=S.hevy.x.filter(a=>!X[a.d+"|"+a.e]).concat(xs);save();return`Importados ${nw.length} entrenamientos y ${sets} series${bad?` (${bad} filas con fecha ilegible omitidas)`:""}.`}
function trends(){const by={};S.hevy.x.forEach(x=>(by[x.e]=by[x.e]||[]).push(x));return Object.entries(by).map(([e,a])=>{a.sort((p,q)=>p.d<q.d?-1:1);const m=a.map(x=>x.m);let s="Pocos datos",df=0;if(a.length>=4){df=(avg(m.slice(-2))/avg(m.slice(-4,-2))-1)*100;s=df>=2.5?"Mejora":df<=-2.5?"Baja":"Estancado"}return{e,a,s,df,g:grp(e),best:Math.max(...m)}}).sort((p,q)=>q.a.length-p.a.length)}
/* Carga */
function alerts(){const o=[],t=today(),ac=sum(done().filter(s=>s.date>addD(t,-7)&&s.date<=t).map(ld)),ch=sum(done().filter(s=>s.date>addD(t,-28)&&s.date<=t).map(ld))/4,ra=ch?ac/ch:null;if(ra!==null){if(ra>1.5)o.push(["bad",`Carga aguda/crónica ${r1(ra)}: subida brusca de carga.`]);else if(ra>1.3)o.push(["w",`Carga aguda/crónica ${r1(ra)}: atención a la acumulación.`])}
const w=S.well.slice(-3);if(w.length&&avg(w.map(x=>x.fat))>=7)o.push(["bad","Fatiga media ≥7 en tus últimos registros."]);const sl=S.well.slice(-3).filter(x=>x.sleep);if(sl.length&&avg(sl.map(x=>x.sleep))<6.5)o.push(["w","Sueño medio <6,5 h en los últimos registros."]);const hv=S.well.filter(x=>x.hrv),rc=hv.slice(-3),bs=hv.slice(-17,-3);if(rc.length>=2&&bs.length>=5&&avg(rc.map(x=>x.hrv))<avg(bs.map(x=>x.hrv))*.9)o.push(["w","HRV reciente >10% por debajo de tu media previa."]);return{o,ra,ac}}
/* IA */
function ctx(){const sw=done().filter(s=>s.type=="Natación").sort((a,b)=>b.date<a.date?-1:1).slice(0,5).map(s=>({fecha:s.date,series:s.swim}));return JSON.stringify({hoy:today(),plan_habitual:Object.fromEntries(Object.entries(S.plan).map(([k,x])=>[DN[k],x])),semanas:weeks(8).map(w=>{const s=done().filter(x=>mon(x.date)==w);return{semana:w,sesiones:s.length,CrossFit:s.filter(x=>x.type=="CrossFit").length,Gimnasio:s.filter(x=>x.type=="Gimnasio").length,Natacion:s.filter(x=>x.type=="Natación").length,carga:sum(s.map(ld))}}),ultimas_sesiones:done().sort((a,b)=>b.date<a.date?-1:1).slice(0,12).map(s=>({fecha:s.date,tipo:s.type,titulo:s.title,min:s.dur,rpe:s.rpe,resultado:s.wod?.r})),previstas:S.ses.filter(s=>!s.done).map(s=>({fecha:s.date,tipo:s.type,titulo:s.title})),bienestar:S.well.slice(-14),gimnasio:trends().slice(0,15).map(t=>({ejercicio:t.e,grupo:t.g,estado:t.s,sesiones:t.a.length,mejor_1rm_estimado:t.best})),natacion:sw})}
async function ask(task){if(!SM){AI={txt:"La IA no está disponible en esta vista. Ábrela desde claude.ai con sesión iniciada.",p:[]};return render()}AI={txt:"Analizando tus datos…",p:[]};tab="ia";render();
const pr=`Eres mi entrenador (CrossFit, gimnasio, natación, recuperación). Usa SOLO los datos JSON de abajo. Si falta un dato, dilo: no inventes marcas, resultados, fechas ni sesiones. No cambias nada: cada sesión que sugieras va en "propuestas" y yo la apruebo. Responde SOLO con JSON: {"respuesta":"texto en español","propuestas":[{"fecha":"YYYY-MM-DD","tipo":"CrossFit|Gimnasio|Natación|Otro","titulo":"...","detalle":"..."}]}. Si no hay propuestas, usa [].\nTAREA: ${task}\nDATOS: ${ctx()}`;
try{const r=await SM(pr,{cache:false}),m=r.text.match(/\{[\s\S]*\}/);try{const j=JSON.parse(m[0]);AI={txt:j.respuesta||"",p:Array.isArray(j.propuestas)?j.propuestas:[]}}catch(_){AI={txt:r.text,p:[]}}}catch(e){AI={txt:"Error al consultar a Claude: "+(e.message||e.code||"desconocido"),p:[]}}render()}
/* Vistas */
const row=s=>`<div class="r"><span><span class="t ${s.done?"d":"p"}">${s.done?"Realizado":"Previsto"}</span> <b>${fm(s.date)}</b> ${esc(s.type)} · ${esc(s.title||"")} ${s.done?`<span class="mu">${s.dur?s.dur+" min":""}${s.rpe?" · RPE "+s.rpe:""}</span>`:""}</span>${s.src?"":`<span>${s.done?"":`<input id="d${s.id}" placeholder="min" style="width:56px"> <input id="r${s.id}" placeholder="RPE" style="width:56px"> <button class="s" data-a="fin" data-i="${s.id}">Hecho</button> `}<button class="s" data-a="del" data-i="${s.id}">✕</button></span>`}</div>`;
function vIni(){const t=today(),wk=mon(t),dn=done(),ws=weeks(8),lb=ws.map(fm),cnt=ws.map(w=>dn.filter(s=>mon(s.date)==w).length),lo=ws.map(w=>sum(dn.filter(s=>mon(s.date)==w).map(ld))),al=alerts(),lw=S.well[S.well.length-1],pe=S.well.filter(x=>x.kg);
const plan=[1,2,3,4,5,6,0].map(d=>`<div><label>${DN[d]}</label><select data-a="plan" data-i="${d}">${["Descanso",...TY].map(o=>`<option ${S.plan[d]==o?"selected":""}>${o}</option>`).join("")}</select></div>`).join("");
const pl=S.ses.filter(s=>!s.done).sort((a,b)=>a.date<b.date?-1:1),rc=S.ses.filter(s=>s.done).sort((a,b)=>b.date<a.date?-1:1).slice(0,8);
return`<div class="k"><div><b>${dn.filter(s=>mon(s.date)==wk).length}</b><span>Realizados esta semana</span></div><div><b>${pl.filter(s=>mon(s.date)==wk).length}</b><span>Previstos esta semana</span></div><div><b>${Math.round(sum(dn.filter(s=>mon(s.date)==wk).map(ld)))}</b><span>Carga semanal (min×RPE)</span></div><div><b>${dn.length}</b><span>Entrenamientos registrados</span></div></div>
<div class="g"><div class="c"><h2>Entrenamientos por semana</h2>${bars(cnt,lb,"#59c3ff")}</div><div class="c"><h2>Carga acumulada</h2>${bars(lo,lb,"#f2b134")}</div>
<div class="c"><h2>Evolución física</h2>${pe.length?line(pe.map(x=>x.kg),pe.map(x=>fm(x.date)),"#5fd39a")+`<p class="mu">Peso corporal (kg), desde tus registros de recuperación.</p>`:'<p class="mu">Registra tu peso en Carga y recuperación para ver su evolución.</p>'}</div>
<div class="c"><h2>Recuperación</h2>${lw?`<p>Último registro (${fm(lw.date)}): sueño ${lw.sleep??"–"} h · fatiga ${lw.fat??"–"} · estrés ${lw.str??"–"} · HRV ${lw.hrv??"–"}</p>`:'<p class="mu">Aún no hay registros de recuperación.</p>'}${al.o.map(a=>`<p class="${a[0]}">⚠ ${a[1]}</p>`).join("")||(lw?'<p class="ok">Sin señales de alerta con tus datos actuales.</p>':"")}</div></div>
<div class="c"><h2>Plan semanal habitual</h2><div class="f">${plan}</div><button class="b" data-a="gen">Crear sesiones previstas de los próximos 7 días</button></div>
<div class="c"><h2>Añadir sesión</h2><div class="f"><div><label>Fecha</label><input type="date" id="a1" value="${t}"></div><div><label>Tipo</label><select id="a2">${TY.map(o=>`<option>${o}</option>`).join("")}</select></div><div><label>Título</label><input id="a3"></div><div><label>Minutos</label><input id="a4" inputmode="numeric"></div><div><label>RPE (1-10)</label><input id="a5" inputmode="decimal"></div><div><label>Estado</label><select id="a6"><option value="1">Realizado</option><option value="0">Previsto</option></select></div></div><button class="b" data-a="add">Guardar</button></div>
<div class="c"><h2>Previstos</h2>${pl.map(row).join("")||'<p class="mu">No hay sesiones previstas.</p>'}</div><div class="c"><h2>Últimos realizados</h2>${rc.map(row).join("")||'<p class="mu">Todavía no has registrado entrenamientos.</p>'}</div>`}
function vGym(){const T=trends(),ex=T.find(t=>t.e==gx)||T[0],gs=["Todos",...new Set(T.map(t=>t.g))],ws=weeks(8),xs=S.hevy.x.filter(x=>gg=="Todos"||grp(x.e)==gg),vol=ws.map(w=>sum(xs.filter(x=>mon(x.d)==w).map(x=>x.v))/1000);
return`<div class="c"><h2>Importar de Hevy</h2><p class="mu">En Hevy: Perfil → Ajustes → Exportar datos. Sube aquí el CSV; si repites la importación, se actualiza sin duplicar.</p><input type="file" id="hf" accept=".csv,text/csv"><p id="hm">${esc(exp)}</p></div>
${T.length?`<div class="g"><div class="c"><h2>Evolución por ejercicio</h2><select data-a="gx">${T.map(t=>`<option ${t.e==ex.e?"selected":""}>${esc(t.e)}</option>`).join("")}</select>${line(ex.a.map(x=>x.m),ex.a.map(x=>fm(x.d)),"#59c3ff")}<p class="mu">1RM estimado (Epley) en kg · ${ex.a.length} sesiones · ${ex.s}</p></div>
<div class="c"><h2>Volumen por grupo muscular</h2><select data-a="gg">${gs.map(g=>`<option ${g==gg?"selected":""}>${g}</option>`).join("")}</select>${bars(vol,ws.map(fm),"#5fd39a")}<p class="mu">Toneladas por semana. El grupo se deduce del nombre del ejercicio.</p></div></div>
<div class="c"><h2>Mejoras y estancamientos</h2><table><tr><th>Ejercicio</th><th>Grupo</th><th>Estado</th><th>Cambio</th><th>Mejor 1RM</th></tr>${T.map(t=>`<tr><td>${esc(t.e)}</td><td>${t.g}</td><td class="${t.s=="Mejora"?"ok":t.s=="Baja"?"bad":t.s=="Estancado"?"w":"mu"}">${t.s}</td><td>${t.a.length>=4?(t.df>0?"+":"")+r1(t.df)+"%":"–"}</td><td>${r1(t.best)} kg</td></tr>`).join("")}</table><p class="mu">Compara tus 2 últimas sesiones con las 2 anteriores (±2,5%). Criterio orientativo.</p></div>`:'<div class="c"><p class="mu">Importa tu CSV de Hevy para ver progresión de cargas.</p></div>'}`}
function vCf(){const l=S.ses.filter(s=>s.type=="CrossFit").sort((a,b)=>b.date<a.date?-1:1);
return`<div class="c"><h2>Crear WOD / registrar sesión</h2><div class="f"><div><label>Fecha</label><input type="date" id="c1" value="${today()}"></div><div><label>Nombre del WOD</label><input id="c2"></div><div><label>Estado</label><select id="c7"><option value="1">Realizado</option><option value="0">Previsto</option></select></div><div><label>Minutos</label><input id="c5" inputmode="numeric"></div><div><label>RPE</label><input id="c6" inputmode="decimal"></div></div>
<label>Calentamiento</label><textarea id="c3a"></textarea><label>Fuerza</label><textarea id="c3b"></textarea><label>Parte metabólica</label><textarea id="c3c"></textarea><label>Resultado (tiempo, rondas, carga…)</label><input id="c4"><p><button class="b" data-a="cf">Guardar</button> <button class="s" data-a="wod">Generar WOD con IA</button></p></div>
<div class="c"><h2>Historial CrossFit</h2>${l.map(s=>row(s)+`<div class="mu" style="padding-left:8px">${s.wod?.w?"Calentamiento: "+esc(s.wod.w)+"<br>":""}${s.wod?.s?"Fuerza: "+esc(s.wod.s)+"<br>":""}${s.wod?.m?"Metabólico: "+esc(s.wod.m)+"<br>":""}${s.wod?.r?"Resultado: "+esc(s.wod.r):""}${s.notes?esc(s.notes):""}</div>`).join("")||'<p class="mu">Sin sesiones de CrossFit.</p>'}</div>`}
function vNat(){const l=S.ses.filter(s=>s.type=="Natación").sort((a,b)=>a.date<b.date?-1:1),B={},ev=[];l.forEach(s=>{if(!s.done)return;const p=[];(s.swim||[]).forEach(x=>{const k=x.st+"|"+x.d;if(!B[k]||x.t<B[k].t)B[k]={...x,date:s.date};p.push(x.t/x.d*100)});if(p.length)ev.push([s.date,avg(p)])});
return`<div class="c"><h2>Registrar sesión de natación</h2><div class="f"><div><label>Fecha</label><input type="date" id="n1" value="${today()}"></div><div><label>RPE</label><input id="n2" inputmode="decimal"></div><div><label>Estado</label><select id="n3"><option value="1">Realizada</option><option value="0">Prevista</option></select></div></div>
<div class="f"><div><label>Distancia (m)</label><input id="s1" inputmode="numeric"></div><div><label>Estilo</label><select id="s2">${SW.map(o=>`<option>${o}</option>`).join("")}</select></div><div><label>Tiempo (m:ss o s)</label><input id="s3"></div><div><label>Descanso (s)</label><input id="s4" inputmode="numeric"></div><button class="b" data-a="ser">Añadir serie</button></div>
${draft.map((x,i)=>`<div class="r"><span>${x.d} m ${x.st} · ${mmss(x.t)} · ${mmss(x.t/x.d*100)}/100 m · descanso ${x.r||0} s</span><button class="s" data-a="dser" data-i="${i}">✕</button></div>`).join("")}<p><button class="b" data-a="nsave">Guardar sesión (${draft.length} series)</button></p></div>
<div class="g"><div class="c"><h2>Ritmo medio por 100 m</h2>${line(ev.map(e=>e[1]),ev.map(e=>fm(e[0])),"#59c3ff")}<p class="mu">Segundos por 100 m en cada sesión realizada.</p></div>
<div class="c"><h2>Mejores marcas</h2><table><tr><th>Estilo</th><th>Distancia</th><th>Tiempo</th><th>Ritmo/100</th></tr>${Object.values(B).sort((a,b)=>a.st<b.st?-1:a.d-b.d).map(b=>`<tr><td>${b.st}</td><td>${b.d} m</td><td>${mmss(b.t)}</td><td>${mmss(b.t/b.d*100)}</td></tr>`).join("")||'<tr><td class="mu" colspan="4">Sin series registradas.</td></tr>'}</table></div></div>
<div class="c"><h2>Historial</h2>${l.slice().reverse().map(row).join("")||'<p class="mu">Sin sesiones.</p>'}</div>`}
function vCar(){const ws=weeks(8),dn=done(),al=alerts(),w=S.well.slice(-14);
return`<div class="g"><div class="c"><h2>Carga semanal</h2>${bars(ws.map(x=>sum(dn.filter(s=>mon(s.date)==x).map(ld))),ws.map(fm),"#f2b134")}<p class="mu">Carga = duración (min) × RPE. Solo cuentan sesiones con ambos datos (en Hevy, solo si el CSV trae RPE).</p>${al.ra!==null?`<p>Ratio agudo/crónico: <b>${r1(al.ra)}</b></p>`:'<p class="mu">Aún no hay carga suficiente para calcular el ratio.</p>'}</div>
<div class="c"><h2>Señales de fatiga</h2>${al.o.map(a=>`<p class="${a[0]}">⚠ ${a[1]}</p>`).join("")||'<p class="ok">Sin señales de acumulación de fatiga con tus datos.</p>'}<p class="mu">Umbrales orientativos, no un diagnóstico médico.</p></div></div>
<div class="c"><h2>Registrar recuperación</h2><div class="f"><div><label>Fecha</label><input type="date" id="w1" value="${today()}"></div><div><label>Sueño (h)</label><input id="w2" inputmode="decimal"></div><div><label>Fatiga (1-10)</label><input id="w3" inputmode="decimal"></div><div><label>Estrés (1-10)</label><input id="w4" inputmode="decimal"></div><div><label>HRV (ms)</label><input id="w5" inputmode="decimal"></div><div><label>Peso (kg)</label><input id="w6" inputmode="decimal"></div></div><button class="b" data-a="well">Guardar registro</button></div>
<div class="g"><div class="c"><h2>Fatiga</h2>${line(w.filter(x=>x.fat).map(x=>x.fat),w.filter(x=>x.fat).map(x=>fm(x.date)),"#ff6b6b")}</div><div class="c"><h2>HRV</h2>${line(w.filter(x=>x.hrv).map(x=>x.hrv),w.filter(x=>x.hrv).map(x=>fm(x.date)),"#5fd39a")}</div></div>`}
function vIa(){const q=(t,l)=>`<button class="s" data-a="q" data-i="${t}">${l}</button> `;
return`<div class="c"><h2>Entrenador IA</h2><p class="mu">Claude analiza solo los datos guardados aquí. Nada cambia sin tu aprobación.</p><p>${q("Analiza mis últimos entrenamientos y mi evolución.","Analizar entrenamientos")}${q("Propón una planificación semanal para los próximos 7 días según mi plan habitual y mi estado.","Planificar semana")}${q("Recomienda cómo recuperar según mi carga y mis registros de recuperación.","Recuperación")}${q("Detecta desequilibrios entre CrossFit, gimnasio y natación.","Desequilibrios")}${q("Recomienda la próxima sesión.","Próxima sesión")}</p><textarea id="q" placeholder="O pregunta lo que quieras sobre tus datos"></textarea><p><button class="b" data-a="free">Preguntar</button></p></div>
${AI?`<div class="c"><pre>${esc(AI.txt)}</pre></div>${AI.p.map((p,i)=>`<div class="c"><h3>Propuesta · ${esc(p.fecha)} · ${esc(p.tipo)}</h3><b>${esc(p.titulo)}</b><pre>${esc(p.detalle)}</pre><p><button class="b" data-a="apr" data-i="${i}">Aprobar y añadir como previsto</button> <button class="s" data-a="rej" data-i="${i}">Descartar</button></p></div>`).join("")}`:""}`}
function vDat(){return`<div class="c"><h2>Copia de seguridad</h2><p class="mu">Tus datos se guardan en tu cuenta de claude.ai. Exporta una copia de vez en cuando por seguridad.</p><p><button class="b" data-a="exp">Exportar todos los datos</button></p>${exp&&tab=="dat"?`<label>Copia (cópiala y guárdala en un archivo .json)</label><textarea id="ex" style="min-height:120px">${esc(exp)}</textarea>`:""}<label>Restaurar desde una copia (.json)</label><input type="file" id="rf" accept=".json"></div>`}
function render(){$("#nav").innerHTML=TABS.map(t=>`<button class="${t[0]==tab?"on":""}" data-a="tab" data-i="${t[0]}">${t[1]}</button>`).join("");const V={ini:vIni,gym:vGym,cf:vCf,nat:vNat,car:vCar,ia:vIa,dat:vDat};$("#app").innerHTML=`<h1>${TABS.find(t=>t[0]==tab)[1]}</h1><p class="mu" id="st" style="margin:-4px 0 10px;font-size:13px">${esc(st)}</p>`+V[tab]()}
/* Eventos */
const nid=()=>"s"+Date.now()+Math.floor(Math.random()*999);
document.addEventListener("click",async e=>{const b=e.target.closest("[data-a]");if(!b||b.tagName=="SELECT")return;const a=b.dataset.a,i=b.dataset.i;let ch=false;
if(a=="tab"){tab=i;exp=tab=="gym"?"":exp}
else if(a=="add"){S.ses.push({id:nid(),date:v("a1")||today(),type:v("a2"),title:v("a3"),dur:num(v("a4")),rpe:num(v("a5")),done:v("a6")=="1"});ch=1}
else if(a=="fin"){const s=S.ses.find(x=>x.id==i);s.done=true;s.dur=num(v("d"+i));s.rpe=num(v("r"+i));ch=1}
else if(a=="del"){if(!confirm("¿Borrar esta sesión?"))return;S.ses=S.ses.filter(x=>x.id!=i);ch=1}
else if(a=="gen"){const t=today();for(let k=0;k<7;k++){const d=addD(t,k),ty=S.plan[new Date(d+"T12:00").getDay()];if(ty&&ty!="Descanso"&&!S.ses.some(s=>s.date==d&&s.type==ty))S.ses.push({id:nid(),date:d,type:ty,title:"Sesión prevista",done:false})}ch=1}
else if(a=="cf"){S.ses.push({id:nid(),date:v("c1")||today(),type:"CrossFit",title:v("c2"),dur:num(v("c5")),rpe:num(v("c6")),done:v("c7")=="1",wod:{w:v("c3a"),s:v("c3b"),m:v("c3c"),r:v("c4")}});ch=1}
else if(a=="wod")return ask("Genera un WOD de CrossFit para mi próxima sesión de CrossFit. En el campo detalle incluye: Calentamiento, Fuerza y Parte metabólica. Usa solo cargas coherentes con mis datos; si no tienes datos de cargas, indícalo y usa porcentajes.");
else if(a=="ser"){const d=num(v("s1")),t=pt(v("s3"));if(!d||!t){alert("Indica distancia y tiempo.");return}draft.push({d,st:v("s2"),t,r:num(v("s4"))||0})}
else if(a=="dser")draft.splice(+i,1);
else if(a=="nsave"){if(!draft.length){alert("Añade al menos una serie.");return}S.ses.push({id:nid(),date:v("n1")||today(),type:"Natación",title:Math.round(sum(draft.map(x=>x.d)))+" m",dur:Math.round(sum(draft.map(x=>x.t+x.r))/60),rpe:num(v("n2")),done:v("n3")=="1",swim:draft});draft=[];ch=1}
else if(a=="well"){const d=v("w1")||today();S.well=S.well.filter(x=>x.date!=d).concat({date:d,sleep:num(v("w2")),fat:num(v("w3")),str:num(v("w4")),hrv:num(v("w5")),kg:num(v("w6"))}).sort((p,q)=>p.date<q.date?-1:1);ch=1}
else if(a=="q")return ask(i);else if(a=="free"){if(v("q").trim())return ask(v("q"))}
else if(a=="apr"){const p=AI.p[+i],ty=TY.includes(p.tipo)?p.tipo:"Otro";S.ses.push({id:nid(),date:/^\d{4}-\d\d-\d\d$/.test(p.fecha)?p.fecha:today(),type:ty,title:p.titulo,notes:p.detalle,done:false});AI.p.splice(+i,1);ch=1}
else if(a=="rej")AI.p.splice(+i,1);
else if(a=="exp"){exp=JSON.stringify({version:1,exportado:new Date().toISOString(),...S},null,1);try{const d=await claude.use("downloads");if(d)await d.save({filename:"entrenamientos-"+today()+".json",data:exp})}catch(_){}}
if(ch)save();render()});
document.addEventListener("change",e=>{const t=e.target,a=t.dataset?.a;if(a=="plan"){S.plan[t.dataset.i]=t.value;save()}else if(a=="gx"){gx=t.value;render()}else if(a=="gg"){gg=t.value;render()}
else if(t.id=="hf"&&t.files[0])t.files[0].text().then(x=>{exp=impHevy(x);render()});
else if(t.id=="rf"&&t.files[0])t.files[0].text().then(x=>{try{const j=JSON.parse(x);if(!j.ses||!j.hevy)throw 0;if(!confirm("Se reemplazarán tus datos actuales por la copia. ¿Continuar?"))return;S={...S0(),plan:j.plan,ses:j.ses,well:j.well||[],hevy:j.hevy};save();render()}catch(_){alert("El archivo no es una copia válida.")}})});
init();
</script></body></html>
